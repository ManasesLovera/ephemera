name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://ephemera:ephemera_dev_only@localhost:5432/ephemera

jobs:
  core:
    name: Core (fmt + clippy + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ephemera
          POSTGRES_PASSWORD: ephemera_dev_only
          POSTGRES_DB: ephemera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephemera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/ephemera-core
            crates/ephemera-app

      - name: Check formatting (ephemera-core)
        working-directory: crates/ephemera-core
        run: cargo fmt --check

      - name: Clippy (ephemera-core)
        working-directory: crates/ephemera-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (ephemera-core)
        working-directory: crates/ephemera-core
        run: cargo test --verbose

  app:
    name: Slint App (fmt + clippy + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/ephemera-core
            crates/ephemera-app

      - name: Check formatting (ephemera-app)
        working-directory: crates/ephemera-app
        run: cargo fmt --check

      - name: Clippy (ephemera-app)
        working-directory: crates/ephemera-app
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (ephemera-app)
        working-directory: crates/ephemera-app
        run: cargo test --verbose

      - name: Build release (ephemera-app)
        working-directory: crates/ephemera-app
        run: cargo build --release --verbose
