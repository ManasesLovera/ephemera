name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Builds native Slint binaries for Linux (x86_64 + arm64), Windows (x86_64), and macOS
# (Apple Silicon + Intel), then attaches them all to a GitHub Release for that tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: ephemera-app-linux-x86_64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: ephemera-app-linux-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: ephemera-app-windows-x64.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset_name: ephemera-app-macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            asset_name: ephemera-app-macos-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/ephemera-core
            crates/ephemera-app

      - name: Build Slint binary
        working-directory: crates/ephemera-app
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          cd crates/ephemera-app/target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp ephemera-app.exe ${{ matrix.asset_name }}
          else
            cp ephemera-app ${{ matrix.asset_name }}
          fi

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          name: "Ephemera ${{ github.ref_name }}"
          body: |
            See [DOWNLOAD.md](https://github.com/ManasesLovera/ephemera/blob/main/DOWNLOAD.md) for
            which file to pick and what each tier needs at runtime.
          draft: false
          prerelease: false
          files: crates/ephemera-app/target/${{ matrix.target }}/release/${{ matrix.asset_name }}
