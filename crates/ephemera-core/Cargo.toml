[package]
name = "ephemera-core"
version = "1.0.0"
description = "Pure Rust core logic and storage tiers for Ephemera"
authors = ["Ephemera"]
edition = "2021"

[lib]
name = "ephemera_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
mime_guess = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
jsonwebtoken = "9"
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
