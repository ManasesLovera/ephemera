[package]
name = "ephemera-app"
version = "1.0.0"
description = "Slint application shell for Ephemera — the Tauri-free replacement for the Tauri+React shell"
authors = ["Ephemera"]
edition = "2021"

[dependencies]
ephemera-core = { path = "../ephemera-core" }
slint = "1.17"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
rfd = "0.16"
dotenvy = "0.15"

[build-dependencies]
slint-build = "1.17"

# Standalone workspace so this crate keeps its own Cargo.lock and never joins a
# parent workspace that pulls in the Tauri build.
[workspace]
